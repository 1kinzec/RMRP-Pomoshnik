name: Build and publish RMRP Помощник

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build application and installer
        shell: cmd
        run: build_windows.bat

      - name: Publish installer and manifest to Supabase Storage
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python release/publish_release.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RMRP-Pomoshnik-${{ github.ref_name }}
          path: |
            installer/output/RMRP-Pomoshnik-Setup-*.exe
            release/latest.json
          if-no-files-found: error
          retention-days: 30

name: Build RMRP Помощник for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip

      - name: Установить PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Собрать EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RMRP_Pomoshnik app/RMRP_Pomoshnik.pyw

      - name: Установить Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Собрать установщик
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\RMRP-Pomoshnik.iss'

      - name: Загрузить готовые файлы
        uses: actions/upload-artifact@v4
        with:
          name: RMRP-Pomoshnik-Windows
          path: |
            dist/RMRP_Pomoshnik.exe
            installer/output/RMRP-Pomoshnik-Setup-*.exe
